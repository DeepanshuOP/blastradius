[project]
name = "blastradius"
version = "0.1.0"
description = "Execution-grounded change impact prediction for CI"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "requests",
]

[project.optional-dependencies]
graph = ["graphifyy", "duckdb"]
dashboard = ["streamlit==1.65.0"]

[dependency-groups]
dev = [
    "pytest",
    "responses",
]

[tool.uv.sources]
graphifyy = { path = "vendor/graphify-br", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/fixtures holds REAL checked-in source trees, including genuine pytest
# and JUnit modules the graph layer extracts (tests/fixtures/graph/minirepo).
# They are inputs, not this suite's tests, so collection must not walk into them.
norecursedirs = ["vendor", "tests/fixtures"]
