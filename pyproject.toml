[project]
name = "blastradius"
version = "0.1.0"
description = "Execution-grounded change impact prediction for CI"
requires-python = ">=3.11,<3.12"
dependencies = [
    "requests",
]

[dependency-groups]
dev = [
    "pytest",
    "responses",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
