[project]
name = "blastradius"
version = "0.1.0"
description = "Execution-grounded change impact prediction for CI"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "requests",
]

[dependency-groups]
dev = [
    "pytest",
    "responses",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["vendor"]
